plugins {
    alias(libs.plugins.androidApplication)
    id 'com.google.gms.google-services'
}

android {
    namespace 'team.y2k2.globa'
    compileSdk 34

    buildFeatures {
        viewBinding = true
    }

    dataBinding {
        enable = true
    }

    signingConfigs {
        release {
            // 이전에 키 생성 시 지정했던 .jks 파일 경로
            storeFile file('/Users/haebun/globa.jks')
            // 키 저장소(store) 비밀번호
            storePassword 'globa1126!'
            // 키 별명(alias)
            keyAlias 'key0'
            // 키 별명(alias)의 비밀번호
            keyPassword 'globa1126!'
        }
    }

    defaultConfig {
        applicationId "team.y2k2.globa"
        minSdk 30
        targetSdk 35
        versionCode 9
        versionName "1.0"
        ndk {
            abiFilters 'armeabi-v7a', 'arm64-v8a'
        }
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release

        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    implementation libs.lottie
    implementation 'com.antonkarpenko:ffmpeg-kit-full:1.2.0'

    implementation platform(libs.firebase.bom)
    implementation libs.firebase.auth
    implementation libs.firebase.analytics
    implementation libs.firebase.storage
    implementation libs.google.firebase.auth
    implementation libs.firebase.messaging
    implementation libs.play.services.auth

    implementation libs.kakao.v2.user.rx
    implementation libs.oauth

    implementation libs.retrofit
    implementation libs.converter.gson
    implementation libs.logging.interceptor


    implementation libs.recyclerview

    implementation libs.swiperefreshlayout
    implementation libs.circleimageview
    implementation libs.glide

    implementation libs.mpandroidchart

    implementation libs.rxjava
    implementation libs.rxandroid
    implementation libs.exoplayer

    implementation libs.material

    implementation libs.profileinstaller

    implementation libs.appcompat
    implementation libs.material
    implementation libs.activity
    implementation libs.constraintlayout
    implementation libs.lifecycle.livedata.ktx
    implementation libs.lifecycle.viewmodel.ktx
    implementation libs.recyclerview.v7
    implementation libs.annotation.jvm
    implementation libs.navigation.fragment
    implementation libs.navigation.ui
    testImplementation libs.junit
    testImplementation libs.assertj.core
    androidTestImplementation libs.ext.junit
    androidTestImplementation libs.espresso.core
    androidTestImplementation 'androidx.test.espresso:espresso-intents:3.5.1'
    androidTestImplementation 'androidx.test.espresso:espresso-idling-resource:3.5.1'
    debugImplementation "androidx.fragment:fragment-testing:1.8.0"
    androidTestImplementation "androidx.test.espresso:espresso-contrib:3.5.1" // 사용 중인 espresso-core 버전과 맞추는 것이 좋습니다.
    androidTestImplementation 'org.hamcrest:hamcrest-library:2.2'
}